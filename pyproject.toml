[tool.poetry]
name = "adversarial-optimization"
version = "0.1.0"
description = "Adversarial optimization experiments with Frank-Wolfe"
authors = ["mattiazza <mattiapiazza@gmail.com>"]
readme = "README.md"
packages = [{include = "adversarial_optimization"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.24.0"
matplotlib = "^3.7.0"
transformers = "^4.55.2"
datasets = "^2.14.0"
huggingface-hub = "^0.34.0"
ipykernel = "^6.25.0"
torch = "^2.7.1"
torchvision = "^0.22.1"
timm = "^1.0.16"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.2"
rich = "^14.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
